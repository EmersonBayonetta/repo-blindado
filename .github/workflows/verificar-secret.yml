name: Verificar mascaramento de secret

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verificar-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar que a secret esta configurada e verificar mascaramento
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
        run: |
          if [ -z "$CHAVE_MESTRA" ]; then
            echo "::error::A secret CHAVE_MESTRA nao esta configurada."
            exit 1
          fi

          echo "Valor da secret CHAVE_MESTRA: $CHAVE_MESTRA"